name: Update GNLL calendars

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate calendars
        run: python generate_calendar.py

      - name: Commit schedule changes
        run: |
          git config user.name "GNLL Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No schedule changes."
          else
            git commit -m "Update GNLL schedule"
            git push
          fi
